# CPU optimization for Ryzen 9 7950X (Zen 4)
COMMON_FLAGS="-O2 -march=native -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Dual GPU Drivers: builds RADV (Navi 31) and Gallium radeonsi (Navi 31 + Oland)
VIDEO_CARDS="amdgpu radeonsi"

# Core USE flags
USE="wayland vulkan pipewire elogind -systemd X xwayland"

# Build concurrency (16 cores / 32 threads)
MAKEOPTS="-j32"
EMERGE_DEFAULT_OPTS="--jobs=16 --load-average=32 --quiet-build=y"

# Accept standard licenses
ACCEPT_LICENSE="*"
